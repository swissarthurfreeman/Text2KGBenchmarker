# @package _global_

trust_remote_code: true
lr_scheduler: "inverse_square_root"

eval_beams: 10
num_return_sequences: 10
warmup_steps: 115
dropout: 0.10
relation_mapping: true
sim_threshold: 0.3

entailement_filtering: true

# initial learning rate will be lower, it'll warm up to this
# learning rate and then drop using lr_scheduler policy
learning_rate: 0.00005
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00000001
max_grad_norm: 1.0

# optimization, careful not to have a batch size that's too large, with multiple
# beams this can lead to an out of memory
train_batch_size: 64
eval_batch_size: 32
gradient_acc_steps: 1
gradient_clip_value: 10.0
max_steps: 200

# evaluation and persistence
apply_early_stopping: False
val_check_interval: 1.0
val_percent_check: 1.0
monitor_var: 'val_F1_micro'
monitor_var_mode: 'max'
patience: 20
model_name: 'text2kgbench'
save_top_k: 1

# core
gpus: 1
precision: "16-mixed"
amp_level: 

do_train: True
do_eval: True
do_predict: False
evaluation_strategy: "no"
prediction_loss_only: False
checkpoint_path: 

per_device_train_batch_size: 8
per_device_eval_batch_size: 8

per_gpu_train_batch_size: 
per_gpu_eval_batch_size: 

gradient_accumulation_steps: 1
eval_accumulation_steps: 

num_train_epochs: 7.0

seed: 42

fp16_opt_level: "O1"
fp16_backend: "auto"
local_rank: -1

dataloader_drop_last: False
eval_steps: 
dataloader_num_workers: 0

past_index: -1

run_name: 
disable_tqdm: true 

remove_unused_columns: True
label_names: 

load_best_model_at_end: False
metric_for_best_model: 
greater_is_better: 
ignore_data_skip: False
sharded_ddp: False
deepspeed: 
label_smoothing_factor: 0.0
adafactor: False
group_by_length: False

dataloader_pin_memory: True


label_smoothing: 0.0
sortish_sampler: False
predict_with_generate: False
decoder_layerdrop:
attention_dropout: 
classifier: False
# Callbacks
samples_interval: 1000

# Logger
offline_mode: False
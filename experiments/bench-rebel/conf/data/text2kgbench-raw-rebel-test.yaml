  - 'data/wikidata_tekgen/train/ont_1_movie_train.jsonl'

val_files:
  - 'data/wikidata_tekgen/test/ont_1_movie_test.jsonl'

output_dir_path: 'experiments/results/llm_responses/rebel-raw-3-beams-1-ret-seq/'

# generation hyperparameters
num_return_sequences: 1             # top likeliest number of beams kept in output (beams get folded into one predicted triple set)
eval_beams: 3                       # number of beams to use during generation
max_target_length: 256              # maximum generated linearized triples output length
only_relations_in_ontology: false   # only keep triples whose relation label is in ontology
parse_dates: false                  # wether or not to parse dates to canonical form, 1955 -> 01 January 1955
date_relation_labels:               # list of relation labels that are to be parsed as dates
  - 'publication date'
  - 'inception'
  - 'start time'


# model hyperparameters
dropout: 0.1




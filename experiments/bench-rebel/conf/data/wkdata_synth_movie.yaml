# @package _global_

# dataset configuration
dataset_script_path: 'experiments/bench-rebel/datasets/wkdata_synth_movie.py'
ontology_path:       'data/wikidata_synthetic/ontologies/ont_1_movie.json'
train_file:          'data/wikidata_synthetic/train/ont_1_movie_train.jsonl'
val_file:            'data/wikidata_synthetic/validation/ont_1_movie_val.jsonl'


text_key:   'sent'
target_key: 'triples'

train_batch_size: 24
val_batch_size:   16
test_batch_size:  16

pretrained_model_name_or_path: 'experiments/bench-rebel/Rebel-large'

# used for evaluation of model on test data, set do_test_predict to true and update
# test file to 'data/wikidata_tekgen/test/ont_1_movie_test.jsonl' and retrieve responses
# retrieve responses from experiments/bench-rebel/src/llm_responses
do_test_predict:  false
test_file:        'data/wikidata_synthetic/test/ont_1_movie_test.jsonl'
checkpoint_path:  'experiments/bench-rebel/src/outputs/2024-11-28/21-57-35/wikidata_movies_12_ret_seq_warm_steps=500_tbs=24_drop=0.1_/epoch=0-step=199.ckpt'
output_file_path: 'experiments/bench-rebel/src/llm_responses/ont_1_movie_test_predictions.jsonl'

# triple processing
relation_mapping: False
sentence_entailement: False
similarity_threshold: 0.3

pl_seed: 42

# model hyperparameters
dropout: 0.1

# generation hyperparameters
max_target_length: 256        # maximum generated linearized triples output length
eval_beams: 12                # number of beams to use during generation
num_return_sequences: 12      # top likeliest number of beams kept in output (beams get folded into one predicted triple set)

# trainer parameters
val_check_interval: 1.0       # check validation metric at every training epoch (0.5 would mean every time a half of the train data is seen, check validation metrics)
max_steps: 100_000
monitor_var: 'val_F1_micro'


# optimization hyperparameters
warmup_steps: 8000
gradient_acc_steps: 1
gradient_clip_value: 10

lr_scheduler: 'inverse_square_root'
learning_rate: 0.000025
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00000001
max_grad_norm: 1.0
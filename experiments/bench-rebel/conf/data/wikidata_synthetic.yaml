# @package _global_

# dataset configuration
dataset_script_path: 'experiments/bench-rebel/datasets/wikidata_synthetic.py'

ontology_paths:
  - 'data/wikidata_synthetic/ontologies/ont_1_movie.json'
  - 'data/wikidata_synthetic/ontologies/ont_2_music.json'
  - 'data/wikidata_synthetic/ontologies/ont_3_sport.json'
  - 'data/wikidata_synthetic/ontologies/ont_4_book.json'
  - 'data/wikidata_synthetic/ontologies/ont_5_military.json'
  - 'data/wikidata_synthetic/ontologies/ont_6_computer.json'
  - 'data/wikidata_synthetic/ontologies/ont_7_space.json'
  - 'data/wikidata_synthetic/ontologies/ont_8_politics.json'
  - 'data/wikidata_synthetic/ontologies/ont_9_nature.json'
  - 'data/wikidata_synthetic/ontologies/ont_10_culture.json'

train_files:
  - 'data/wikidata_synthetic/train/ont_1_movie_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_2_music_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_3_sport_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_4_book_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_5_military_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_6_computer_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_7_space_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_8_politics_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_9_nature_train.jsonl'
  - 'data/wikidata_synthetic/train/ont_10_culture_train.jsonl'

val_files:
  - 'data/wikidata_synthetic/validation/ont_1_movie_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_2_music_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_3_sport_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_4_book_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_5_military_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_6_computer_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_7_space_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_8_politics_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_9_nature_val.jsonl'
  - 'data/wikidata_synthetic/validation/ont_10_culture_val.jsonl'

text_key:   'sent'
target_key: 'triples'

train_batch_size: 24
val_batch_size:   16
test_batch_size:  10

pretrained_model_name_or_path: 'experiments/bench-rebel/Rebel-large'

# used for evaluation of model on test data, set do_test_predict to true and update
# test file to 'data/wikidata_tekgen/test/ont_1_movie_test.jsonl' and retrieve responses
# retrieve responses from experiments/bench-rebel/src/llm_responses
do_test_predict:  false

test_files:
  - 'data/wikidata_synthetic/test/ont_1_movie_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_2_music_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_3_sport_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_4_book_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_5_military_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_6_computer_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_7_space_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_8_politics_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_9_nature_test.jsonl'
  - 'data/wikidata_synthetic/test/ont_10_culture_test.jsonl'


checkpoint_path:  'experiments/bench-rebel/src/outputs/2024-12-01/19-36-40/wikidata_movies_4_ret_seq_warm_steps=2000_tbs=24_drop=0.1_/epoch=0-step=1500.ckpt'
output_file_path: 'experiments/bench-rebel/src/llm_responses/oidsjglfdskjgfdsj.jsonl'

# set this to 0 to not drop any triples with relation mapping
similarity_threshold: 0.3

num_return_sequences: 3      # top likeliest number of beams kept in output (beams get folded into one predicted triple set)

pl_seed: 42

# model hyperparameters
dropout: 0.1

# generation hyperparameters
max_target_length: 256        # maximum generated linearized triples output length
eval_beams: 12                # number of beams to use during generation

# trainer parameters
val_check_interval: 1       # check validation metric at every training epoch (0.5 would mean every time a half of the train data is seen, check validation metrics)
max_steps: 20_000
monitor_var: 'val_F1_micro'


# optimization hyperparameters
warmup_steps: 2000
gradient_acc_steps: 1
gradient_clip_value: 10

lr_scheduler: 'linear'
learning_rate: 0.000025
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00000001
max_grad_norm: 1.0